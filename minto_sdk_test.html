<!doctype html>
<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MintoAI - SDK Test</title><style>body{font:16px system-ui;background:#f5faf8;color:#193c35;max-width:800px;margin:48px auto;padding:0 20px}pre{background:white;border:1px solid #cdded8;padding:20px;border-radius:12px;white-space:pre-wrap}button{padding:10px 18px;cursor:pointer} </style></head><body><h1>MintoAI · SDK Test</h1><p>Kiểm tra Cubism Core bằng model mẫu Haru; không tạo dataset và không lưu dữ liệu huấn luyện.</p><button id="run">Chạy kiểm thử</button><pre id="out">Sẵn sàng.</pre><script src="SDK/CubismSdkForWeb-5-r.5/Core/live2dcubismcore.js"></script><script>
const base='SDK/CubismSdkForWeb-5-r.5/';
const out=document.getElementById('out');
async function ready(){for(let i=0;i<100;i++){try{let v=Live2DCubismCore.Version.csmGetVersion();if(v)return v;}catch(e){}await new Promise(r=>setTimeout(r,100));}throw Error('Cubism Core chưa sẵn sàng. Kiểm tra đường dẫn SDK.');}
async function run(){let moc,model;const log=s=>out.textContent+=s+'\n';out.textContent='';document.getElementById('run').disabled=true;try{let v=await ready();log('Core version: '+v);let r=await fetch(base+'Samples/Resources/Haru/Haru.moc3');if(!r.ok)throw Error('HTTP '+r.status+' khi đọc Haru.moc3');moc=Live2DCubismCore.Moc.fromArrayBuffer(await r.arrayBuffer());if(!moc)throw Error('Moc load failed');model=Live2DCubismCore.Model.fromMoc(moc);if(!model)throw Error('Model load failed');const p=model.parameters,d=model.drawables;log('Model: Haru');log('Parameters: '+p.count);log('Drawables: '+d.count);log('Vertices: '+Array.from(d.vertexCounts).reduce((a,b)=>a+b,0));p.values.set(p.defaultValues);model.update();const before=d.vertexPositions.map(a=>Float32Array.from(a));const k=p.ids.indexOf('ParamAngleX');if(k<0)throw Error('ParamAngleX not found');p.values[k]=p.maximumValues[k];model.update();let moved=0;for(let i=0;i<d.count;i++){const a=before[i],b=d.vertexPositions[i];if(a.some((x,j)=>Math.abs(x-b[j])>1e-6))moved++;}log('ParamAngleX: '+p.defaultValues[k]+' → '+p.maximumValues[k]);log('Drawables with changed vertices: '+moved);if(!moved)throw Error('No mesh movement detected');log('PASS: Cubism Core đọc model và cập nhật mesh thành công.');}catch(e){log('FAIL: '+e.message);}finally{if(model)model.release();if(moc)moc._release();document.getElementById('run').disabled=false;}}
document.getElementById('run').onclick=run;run();
</script></body></html>
