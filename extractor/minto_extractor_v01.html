<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MintoAI • Dataset Extractor V0.1</title><style>body{font:16px system-ui;background:#f4faf8;color:#193c35;max-width:840px;margin:40px auto;padding:0 20px}section,pre{background:white;border:1px solid #cdded8;padding:18px;border-radius:12px;margin:16px 0}label{display:block;margin:12px 0}button,select,input{font:inherit}button{padding:9px 16px;cursor:pointer;margin:5px 6px 5px 0}pre{white-space:pre-wrap;overflow-wrap:anywhere}small{color:#536861}input[type=text]{width:95%;padding:7px}select{max-width:100%}</style></head><body><h1>MintoAI · Dataset Extractor V0.1</h1><p>Đọc mesh runtime của model MOC3 được phép sử dụng; không gửi dữ liệu lên mạng.</p><section><label>1. File MOC3 <input type="file" id="file" accept=".moc3"></label><button id="load">Đọc model</button><label>2. Parameter <select id="param" disabled></select></label><label>3. Nguồn và quyền sử dụng model <input id="source" type="text" placeholder="Tác giả / giấy phép / xác nhận quyền sử dụng"></label><label><input id="permission" type="checkbox"> Tôi đã xác minh quyền sử dụng model và SDK cho mục đích thu thập dữ liệu huấn luyện này.</label><button id="export" disabled>Xuất 21 trạng thái (JSON)</button><small>Chỉ quét một parameter mỗi lần; các parameter khác ở giá trị mặc định. Chưa đọc physics, keyform gốc hoặc cấu trúc deformer.</small></section><pre id="out">Sẵn sàng.</pre><script src="../SDK/CubismSdkForWeb-5-r.5/Core/live2dcubismcore.js"></script><script>
'use strict';
const $=id=>document.getElementById(id);let moc=null,model=null,filename='',coreVersion=0,busy=false;
const log=s=>{$('out').textContent+=s+'\n';};const arr=x=>Array.from(x);const finite=x=>x.every(Number.isFinite);
function refresh(){ $('load').disabled=busy; $('param').disabled=busy||!model; $('export').disabled=busy||!model||!$('permission').checked||!$('source').value.trim(); }
function release(){if(model){model.release();model=null;}if(moc){moc._release();moc=null;}}
async function ready(){for(let i=0;i<100;i++){try{const v=Live2DCubismCore.Version.csmGetVersion();if(v)return v;}catch(e){}await new Promise(r=>setTimeout(r,100));}throw Error('Cubism Core chưa sẵn sàng. Kiểm tra đường dẫn SDK.');}
async function load(){busy=true;refresh();$('out').textContent='';try{release();$('param').replaceChildren();const f=$('file').files[0];if(!f)throw Error('Chọn file .moc3 trước.');coreVersion=await ready();filename=f.name;moc=Live2DCubismCore.Moc.fromArrayBuffer(await f.arrayBuffer());if(!moc)throw Error('MOC load failed');model=Live2DCubismCore.Model.fromMoc(moc);if(!model)throw Error('Model load failed');const p=model.parameters,d=model.drawables;for(let i=0;i<p.count;i++){const opt=document.createElement('option');opt.value=String(i);opt.textContent=`${p.ids[i]} [${p.minimumValues[i]}, ${p.maximumValues[i]}]`; $('param').append(opt);}const k=p.ids.indexOf('ParamEyeLOpen');if(k>=0)$('param').value=String(k);log('Model: '+filename);log('Parameters: '+p.count);log('Drawables: '+d.count);log('Vertices: '+arr(d.vertexCounts).reduce((a,b)=>a+b,0));log('PASS: đọc model. Chưa xuất dữ liệu.');}catch(e){release();log('FAIL: '+e.message);}finally{busy=false;refresh();}}
function snapshot(d){return {positions:d.vertexPositions.map(a=>arr(a)),opacities:arr(d.opacities),draw_orders:arr(d.drawOrders),dynamic_flags:arr(d.dynamicFlags)};}
async function exportData(){if(!model||!$('permission').checked||!$('source').value.trim())return;busy=true;refresh();$('out').textContent='';try{const p=model.parameters,d=model.drawables,k=Number($('param').value);if(!Number.isInteger(k)||k<0||k>=p.count)throw Error('Parameter không hợp lệ.');const lo=p.minimumValues[k],hi=p.maximumValues[k],def=p.defaultValues[k];if(!Number.isFinite(lo)||!Number.isFinite(hi)||hi<=lo)throw Error('Parameter không có khoảng quét hợp lệ.');p.values.set(p.defaultValues);model.update();const rest=snapshot(d);const meshes=arr(d.ids).map((id,i)=>({id,vertex_count:d.vertexCounts[i],texture_index:d.textureIndices[i],parent_part_index:d.parentPartIndices[i],constant_flags:d.constantFlags[i],uv:arr(d.vertexUvs[i]),triangles:arr(d.indices[i]),mask_indices:arr(d.masks[i]),vertices_rest:rest.positions[i]}));const samples=[];let moved=new Set();for(let i=0;i<=20;i++){p.values.set(p.defaultValues);p.values[k]=lo+(hi-lo)*i/20;model.update();const s=snapshot(d);for(let j=0;j<d.count;j++){const a=s.positions[j],b=rest.positions[j];if(a.length!==b.length||!finite(a))throw Error('Invalid vertex array: '+d.ids[j]);if(a.some((x,t)=>Math.abs(x-b[t])>1e-6))moved.add(j);}samples.push({value:p.values[k],vertices_posed:s.positions,opacities:s.opacities,draw_orders:s.draw_orders,dynamic_flags:s.dynamic_flags});}const result={schema_version:'raw-0.1',source:filename,permission_note:$('source').value.trim(),permission_user_confirmed:true,core_version:coreVersion,coordinate_system:'Cubism Core native coordinates, xy interleaved',parameter:{id:p.ids[k],min:lo,max:hi,default:def},all_parameter_ids:arr(p.ids),all_parameter_defaults:arr(p.defaultValues),meshes,rest_opacities:rest.opacities,rest_draw_orders:rest.draw_orders,samples};const blob=new Blob([JSON.stringify(result)],{type:'application/json'});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download=filename.replace(/\.moc3$/i,'')+'_'+p.ids[k].replace(/[^a-zA-Z0-9_-]/g,'_')+'.json';document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),60000);log('Parameter: '+p.ids[k]);log('Range: '+lo+' → '+hi+'; default: '+def);log('Poses: '+samples.length);log('Drawables with changed vertices: '+moved.size+'/'+d.count);log('PASS: JSON created; save to C:\\MintoAI\\dataset\\');if(!moved.size)log('WARNING: Không có biến dạng hình học; parameter có thể chỉ thay đổi opacity hoặc không được rig.');}catch(e){log('FAIL: '+e.message);}finally{if(model){model.parameters.values.set(model.parameters.defaultValues);model.update();}busy=false;refresh();}}
$('load').onclick=load;$('export').onclick=exportData;$('permission').onchange=refresh;$('source').oninput=refresh;$('file').onchange=()=>{release();$('param').replaceChildren();$('permission').checked=false;$('source').value='';refresh();};refresh();
</script></body></html>
