<!doctype html><html lang="vi"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MintoAI Batch Extractor V0.2</title>
<style>body{font:16px system-ui;background:#122229;color:#edf7f3;max-width:850px;margin:35px auto;padding:0 18px}h1{color:#bce9db}section,pre{background:#20343b;border:1px solid #41635f;padding:18px;border-radius:12px}label{display:block;margin:12px 0}button,input,select{font:inherit}button{background:#bce9db;color:#142a26;border:0;padding:10px 16px;border-radius:7px;margin-right:8px}button:disabled{opacity:.45}input[type=text]{width:95%;padding:8px}pre{white-space:pre-wrap;overflow-wrap:anywhere;max-height:55vh;overflow:auto}progress{width:100%}small{color:#bfd1cc}</style>
<h1>MintoAI · Batch Extractor V0.2</h1><p>Local only · 7 facial parameters · raw-0.1 → NPZ</p><section><div id="models">Đang đọc danh sách model...</div><label>Trạng thái mỗi parameter <select id="count"><option>21</option><option>51</option><option selected>101</option></select></label><label>Chế độ <select id="mode"><option value="audit">Audit only (không lưu tensor)</option><option value="save">Xuất NPZ huấn luyện</option></select></label><label>Tham chiếu quyền sử dụng <input id="permission" type="text" placeholder="Ví dụ: mã thư cấp phép, phạm vi model + SDK"></label><label><input type="checkbox" id="confirm"> Tôi xác nhận đã có quyền dùng các model được chọn và SDK cho mục đích huấn luyện AI.</label><label><input type="checkbox" id="overwrite"> Ghi đè NPZ cùng model, parameter và số trạng thái</label><button id="start" disabled>Bắt đầu</button><button id="stop" disabled>Dừng sau parameter hiện tại</button><progress id="progress" value="0" max="1"></progress><small>Chưa xử lý physics, texture pixels, motion/expression hay tổ hợp parameter. Không gửi dữ liệu ra Internet.</small></section><pre id="log"></pre>
<script src="/core.js"></script><script>
'use strict';const $=id=>document.getElementById(id), arr=x=>Array.from(x);let models=[],params=[],running=false,stop=false;
function log(s){$('log').textContent+=s+'\n';$('log').scrollTop=$('log').scrollHeight;}
async function json(url,opts){const r=await fetch(url,opts);const d=await r.json();if(!r.ok)throw Error(d.error||r.status);return d;}
async function ready(){for(let i=0;i<150;i++){try{const v=Live2DCubismCore.Version.csmGetVersion();if(v)return v;}catch(e){}await new Promise(r=>setTimeout(r,100));}throw Error('Cubism Core not ready');}
function snap(d){return {positions:d.vertexPositions.map(arr),opacities:arr(d.opacities),draw_orders:arr(d.drawOrders),dynamic_flags:arr(d.dynamicFlags)};}
function extract(model,x,k,count,version,permission,confirmed){const p=model.parameters,d=model.drawables,lo=p.minimumValues[k],hi=p.maximumValues[k],def=p.defaultValues[k];if(!Number.isFinite(lo)||!Number.isFinite(hi)||hi<=lo)throw Error('Invalid parameter range');p.values.set(p.defaultValues);model.update();const rest=snap(d);const meshes=arr(d.ids).map((id,i)=>({id,vertex_count:d.vertexCounts[i],texture_index:d.textureIndices[i],parent_part_index:d.parentPartIndices[i],constant_flags:d.constantFlags[i],uv:arr(d.vertexUvs[i]),triangles:arr(d.indices[i]),mask_indices:arr(d.masks[i]),vertices_rest:rest.positions[i]}));const samples=[];for(let i=0;i<count;i++){p.values.set(p.defaultValues);p.values[k]=lo+(hi-lo)*i/(count-1);model.update();const s=snap(d);samples.push({value:p.values[k],vertices_posed:s.positions,opacities:s.opacities,draw_orders:s.draw_orders,dynamic_flags:s.dynamic_flags});}return {schema_version:'raw-0.1',source:x.name,permission_note:permission,permission_user_confirmed:confirmed,core_version:version,coordinate_system:'Cubism Core native coordinates, xy interleaved',parameter:{id:p.ids[k],min:lo,max:hi,default:def},all_parameter_ids:arr(p.ids),all_parameter_defaults:arr(p.defaultValues),meshes,rest_opacities:rest.opacities,rest_draw_orders:rest.draw_orders,samples};}
async function run(){if(running)return;const selected=models.filter(x=>$('m'+x.id).checked), count=Number($('count').value),save=$('mode').value==='save',permission=$('permission').value.trim(),confirmed=$('confirm').checked,overwrite=$('overwrite').checked;if(!selected.length)return log('Chọn model trước.');if(save&&(!confirmed||!permission))return log('Cần xác nhận và tham chiếu quyền sử dụng.');running=true;stop=false;$('start').disabled=true;$('stop').disabled=false;$('log').textContent='';$('progress').max=selected.length*params.length;$('progress').value=0;let pass=0,fail=0,skip=0;try{const version=await ready();for(const x of selected){if(stop)break;let moc=null,model=null;try{const res=await fetch('/moc?id='+x.id);if(!res.ok)throw Error('MOC download failed');moc=Live2DCubismCore.Moc.fromArrayBuffer(await res.arrayBuffer());if(!moc)throw Error('MOC invalid');model=Live2DCubismCore.Model.fromMoc(moc);if(!model)throw Error('Model invalid');log('MODEL '+x.path+' | '+model.parameters.count+' parameters');for(const id of params){if(stop)break;try{const k=model.parameters.ids.indexOf(id);if(k<0){skip++;log('SKIP '+id+' (absent)');continue;}const raw=extract(model,x,k,count,version,permission,confirmed);const out=await json('/save',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({id:x.id,raw,save,permission,overwrite})});if(out.message.startsWith('SKIP'))skip++;else pass++;log(id+' | '+out.message);}catch(e){fail++;log('FAIL '+id+' | '+e.message);}finally{$('progress').value++;}await new Promise(r=>setTimeout(r,0));}}catch(e){fail++;log('FAIL MODEL '+x.path+' | '+e.message);$('progress').value+=params.length;}finally{if(model)model.release();if(moc)moc._release();}}}catch(e){fail++;log('FAIL '+e.message);}finally{log((stop?'STOPPED':'DONE')+' | PASS '+pass+' | FAIL '+fail+' | SKIP '+skip);running=false;$('start').disabled=false;$('stop').disabled=true;}}
$('start').onclick=run;$('stop').onclick=()=>{stop=true;$('stop').disabled=true;};(async()=>{try{const m=await json('/manifest');models=m.models;params=m.parameters;$('models').replaceChildren();for(const x of models){const l=document.createElement('label'),c=document.createElement('input');c.type='checkbox';c.id='m'+x.id;c.checked=true;l.append(c,document.createTextNode(' '+x.path));$('models').append(l);}log('Unique MOC3: '+models.length);$('start').disabled=!models.length;}catch(e){log('FAIL '+e.message);}})();
</script></html>
